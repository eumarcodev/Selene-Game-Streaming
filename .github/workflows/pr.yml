name: Pull request build

# Pull requests are built only on request: add the `build` label. Without it nothing runs, because local builds and
# tests come first and every merge to develop already builds a release candidate (rc.yml).
on:
  pull_request:
    branches:
      - develop
      - master
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    # Adding another label must not rebuild
    if: >-
      contains(github.event.pull_request.labels.*.name, 'build') &&
      (github.event.action != 'labeled' || github.event.label.name == 'build')
    uses: ./.github/workflows/build.yml
    with:
      version: 0.0.0-pr.${{ github.event.pull_request.number }}
