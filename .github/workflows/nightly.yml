name: Nightly

# Builds `develop` once a day and publishes it as a pre-release, only if there are new commits since the last
# nightly. Keeps the last 7 nightly releases.
#
# Version: one minor above the highest stable/rc version already tagged, e.g. 1.4.0-nightly.20261116
# (so a nightly is always newer than the release candidate that is in progress).
on:
  schedule:
    - cron: "0 6 * * *" # 03:00 in Brasilia (UTC-3)
  workflow_dispatch:
    inputs:
      force:
        description: Build even if develop has no new commits or today's nightly already exists
        type: boolean
        required: false
        default: false

concurrency:
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      sha: ${{ steps.plan.outputs.sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      date: ${{ steps.plan.outputs.date }}
    steps:
      - name: Checkout develop (full history and tags)
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Plan
        id: plan
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          date=$(date -u +%Y%m%d)

          # Highest stable/rc version already tagged (nightly tags are ignored)
          latest=$( (git tag -l 'v[0-9]*' | grep -v -- '-nightly\.' || true) | sed -E 's/^v//; s/-.*$//' | sort -uV | tail -1)
          if [[ -z "${latest}" ]]; then
            base="0.1.0"
          else
            IFS=. read -r major minor _ <<< "${latest}"
            base="${major}.$((minor + 1)).0"
          fi
          version="${base}-nightly.${date}"
          tag="v${version}"

          build=true
          reason="new commits on develop"
          last_tag=$(git tag -l 'v*-nightly.*' --sort=-v:refname | head -1)
          if [[ "${FORCE}" != "true" ]]; then
            if [[ -n "${last_tag}" && "$(git rev-list -n1 "${last_tag}")" == "${sha}" ]]; then
              build=false
              reason="develop has no new commits since ${last_tag}"
            elif git rev-parse -q --verify "refs/tags/${tag}" > /dev/null; then
              build=false
              reason="today's nightly (${tag}) already exists"
            fi
          fi

          {
            echo "build=${build}"
            echo "sha=${sha}"
            echo "version=${version}"
            echo "tag=${tag}"
            echo "date=${date}"
          } >> "$GITHUB_OUTPUT"
          echo "Nightly ${tag} at ${sha}: build=${build} (${reason})" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}
      sign: true

  publish:
    name: Publish pre-release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA: ${{ needs.prepare.outputs.sha }}
      DATE: ${{ needs.prepare.outputs.date }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: selene-android
          path: dist

      - name: Create pre-release
        run: |
          set -euo pipefail
          # A forced run on the same day replaces the existing nightly
          gh release delete "${TAG}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes 2> /dev/null || true
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${SHA}" \
            --title "Selene nightly ${DATE}" \
            --prerelease \
            --latest=false \
            --generate-notes

      - name: Keep only the last 7 nightlies
        run: |
          set -euo pipefail
          gh release list --repo "${GITHUB_REPOSITORY}" --limit 200 --json tagName,publishedAt \
            --jq '[.[] | select(.tagName | test("-nightly\\.[0-9]+$"))] | sort_by(.publishedAt) | reverse | .[7:] | .[].tagName' |
            while read -r old; do
              echo "Deleting ${old}"
              gh release delete "${old}" --repo "${GITHUB_REPOSITORY}" --cleanup-tag --yes
            done
