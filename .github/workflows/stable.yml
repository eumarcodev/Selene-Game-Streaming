name: Stable release

# Pushing a tag vX.Y.Z (no suffix) on a commit of master builds and publishes the stable release:
#   git tag v1.4.0 && git push origin v1.4.0
# Afterwards, pull requests are opened to bring master back into develop (and into open release branches).
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: stable-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Check the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Checkout (full history and branches)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check
        id: check
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "Tag '${GITHUB_REF_NAME}' must look like vX.Y.Z"
          git rev-parse -q --verify origin/master > /dev/null || fail "Branch master does not exist"
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/master ||
            fail "${GITHUB_REF_NAME} (${GITHUB_SHA}) is not on master. Merge the release branch into master first."
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: prepare
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ github.sha }}
      sign: true

  publish:
    name: Publish release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: selene-android
          path: dist

      # The tag already exists (it triggered this run), so the release is attached to it
      - name: Create release
        run: |
          set -euo pipefail
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "Selene ${TAG}" \
            --latest \
            --generate-notes

  sync-back:
    name: Open sync pull requests
    needs: publish
    runs-on: ubuntu-latest
    # Opening PRs needs "Allow GitHub Actions to create and approve pull requests" in the repository settings.
    # A failure here must not fail the release.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout (full history and branches)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Open PRs from master
        run: |
          set -uo pipefail
          targets="develop $(git branch -r --list 'origin/release/*' | sed -E 's#^ *origin/##' | tr '\n' ' ')"
          for base in ${targets}; do
            git rev-parse -q --verify "origin/${base}" > /dev/null || { echo "${base} does not exist, skipping"; continue; }
            if git merge-base --is-ancestor "${GITHUB_SHA}" "origin/${base}"; then
              echo "${base} already contains ${TAG}"
              continue
            fi
            gh pr create --repo "${GITHUB_REPOSITORY}" --base "${base}" --head master \
              --title "chore: sync master into ${base} after ${TAG}" \
              --body "Brings the stable release ${TAG} back into \`${base}\`, so the next builds start from it." ||
              echo "::warning::Could not open the PR for ${base}. Open it manually: master -> ${base}."
          done
