name: Release candidate

# Every merge (push) to develop builds a release candidate and publishes it as a pre-release.
# The version comes from the version.txt file at the repository root:
#   version.txt 1.10.0 -> v1.10.0-rc.1, v1.10.0-rc.2, ...
# Changes that cannot affect the binaries (docs, GitHub config other than the build) do not build an RC.
# Each RC is built twice in parallel from the same commit: vX.Y.Z-rc.N (published as a pre-release) and vX.Y.Z (kept
# as an artifact of this run). A tested RC becomes stable with promote.yml, which publishes that artifact as is.
# When the repository variable PLAY_PUBLISHING is "true", each RC is also uploaded to a Google Play testing track
# (PLAY_RC_TRACK, default "alpha" = closed testing). See .github/RELEASING.md, section "Google Play".
on:
  push:
    branches:
      - develop
    # Later patterns win: everything, minus docs, .github and version.txt, plus the build workflow itself.
    # A version.txt change alone has nothing new to test; the code that comes with it triggers the RC.
    paths:
      - "**"
      - "!**.md"
      - "!docs/**"
      - "!.github/**"
      - "!version.txt"
      - ".github/workflows/build.yml"
  workflow_dispatch:

# A newer merge supersedes the RC that is still building
concurrency:
  group: rc
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.plan.outputs.build }}
      sha: ${{ steps.plan.outputs.sha }}
      base: ${{ steps.plan.outputs.base }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Checkout (full history and tags)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Plan
        id: plan
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          sha=$(git rev-parse HEAD)
          base=$(tr -d ' \r\n' < version.txt)
          [[ "${base}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "version.txt must look like X.Y.Z, got '${base}'"
          git rev-parse -q --verify "refs/tags/v${base}" > /dev/null &&
            fail "v${base} is already released. Bump version.txt on develop (promote.yml does it after each release)."
          latest=$( (git tag -l 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true) | sed 's/^v//' | sort -V | tail -1)
          if [[ -n "${latest}" && "$(printf '%s\n%s\n' "${latest}" "${base}" | sort -V | tail -1)" != "${base}" ]]; then
            fail "version.txt ${base} is lower than the latest stable release v${latest}"
          fi

          build=true
          reason="new release candidate"
          last=$( (git tag -l "v${base}-rc.*" || true) | sed -E 's/.*-rc\.//' | sort -n | tail -1)
          n=$((${last:-0} + 1))

          if [[ -n "${last}" && "$(git rev-list -n1 "v${base}-rc.${last}")" == "${sha}" ]]; then
            build=false
            reason="v${base}-rc.${last} already points at this commit"
          elif git rev-parse -q --verify origin/master > /dev/null && git merge-base --is-ancestor "${sha}" origin/master; then
            build=false
            reason="this commit is already released on master"
          fi

          version="${base}-rc.${n}"
          {
            echo "build=${build}"
            echo "sha=${sha}"
            echo "base=${base}"
            echo "version=${version}"
            echo "tag=v${version}"
          } >> "$GITHUB_OUTPUT"
          echo "RC v${version} at ${sha}: build=${build} (${reason})" | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    name: Build
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}
      sign: true
      play-bundle: ${{ vars.PLAY_PUBLISHING == 'true' }}

  # The same commit built with the stable version (versionCode + 1), in parallel. It is not published here:
  # promote.yml takes this artifact from this run and publishes it as vX.Y.Z, so promoting does not build again.
  build-stable:
    name: Build stable
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.base }}
      ref: ${{ needs.prepare.outputs.sha }}
      sign: true
      play-bundle: ${{ vars.PLAY_PUBLISHING == 'true' }}
      artifact-name: selene-android-stable

  publish:
    name: Publish pre-release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: selene-android
          path: dist

      - name: Create pre-release
        run: |
          set -euo pipefail
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${SHA}" \
            --title "Selene ${TAG}" \
            --prerelease \
            --latest=false \
            --generate-notes

  play:
    name: Google Play
    needs: [prepare, build, publish]
    if: vars.PLAY_PUBLISHING == 'true'
    # play.yml asks for actions: read (it can download artifacts of another run)
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/play.yml
    secrets:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    with:
      version: ${{ needs.prepare.outputs.version }}
      track: ${{ vars.PLAY_RC_TRACK || 'alpha' }}
      status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
