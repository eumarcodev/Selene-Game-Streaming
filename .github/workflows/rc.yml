name: Release candidate
run-name: Release candidate v${{ inputs.version }}

# Builds and publishes one release candidate. It is started by "Queue release candidate" (rc-queue.yml) on every
# merge to develop, which works out the version, so each run is titled with the RC it makes.
# Each RC is built twice in parallel from the same commit: vX.Y.Z-rc.N (published as a pre-release) and vX.Y.Z (kept
# as an artifact of this run). A tested RC becomes stable with promote.yml, which publishes that artifact as is.
# When the repository variable PLAY_PUBLISHING is "true", each RC is also uploaded to a Google Play testing track
# (PLAY_RC_TRACK, default "alpha" = closed testing). See .github/RELEASING.md, section "Google Play".
on:
  workflow_dispatch:
    inputs:
      version:
        description: "RC version without the leading v (e.g. 1.10.0-rc.2). Normally set by Queue release candidate."
        type: string
        required: true
      sha:
        description: Commit of develop to build
        type: string
        required: true

# A newer merge supersedes the RC that is still building
concurrency:
  group: rc
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      base: ${{ steps.plan.outputs.base }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Checkout develop (full history and tags)
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Plan
        id: plan
        env:
          VERSION: ${{ inputs.version }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          [[ "${VERSION}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc\.[0-9]+$ ]] || fail "version must look like X.Y.Z-rc.N, got '${VERSION}'"
          base="${BASH_REMATCH[1]}"
          sha=$(git rev-parse --verify "${SHA}^{commit}") || fail "Commit ${SHA} not found"
          git merge-base --is-ancestor "${sha}" origin/develop || fail "${sha} is not on develop"
          git rev-parse -q --verify "refs/tags/v${VERSION}" > /dev/null && fail "v${VERSION} already exists"
          git rev-parse -q --verify "refs/tags/v${base}" > /dev/null && fail "v${base} is already released"
          {
            echo "sha=${sha}"
            echo "base=${base}"
            echo "version=${VERSION}"
            echo "tag=v${VERSION}"
          } >> "$GITHUB_OUTPUT"
          echo "::notice title=Release candidate::v${VERSION} at ${sha:0:8} (stable v${base} built next to it)"
          echo "Release candidate **v${VERSION}** at ${sha} (stable v${base} built next to it)" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build v${{ needs.prepare.outputs.version }}
    needs: prepare
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.version }}
      ref: ${{ needs.prepare.outputs.sha }}
      sign: true
      play-bundle: ${{ vars.PLAY_PUBLISHING == 'true' }}

  # The same commit built with the stable version (versionCode + 1), in parallel. It is not published here:
  # promote.yml takes this artifact from this run and publishes it as vX.Y.Z, so promoting does not build again.
  build-stable:
    name: Build v${{ needs.prepare.outputs.base }} (stable, kept for promote)
    needs: prepare
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      version: ${{ needs.prepare.outputs.base }}
      ref: ${{ needs.prepare.outputs.sha }}
      sign: true
      play-bundle: ${{ vars.PLAY_PUBLISHING == 'true' }}
      artifact-name: selene-android-stable

  publish:
    name: Publish pre-release ${{ needs.prepare.outputs.tag }}
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: selene-android
          path: dist

      - name: Create pre-release
        run: |
          set -euo pipefail
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${SHA}" \
            --title "Selene ${TAG}" \
            --prerelease \
            --latest=false \
            --generate-notes

  play:
    name: Google Play
    needs: [prepare, build, publish]
    if: vars.PLAY_PUBLISHING == 'true'
    # play.yml asks for actions: read (it can download artifacts of another run)
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/play.yml
    secrets:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    with:
      version: ${{ needs.prepare.outputs.version }}
      track: ${{ vars.PLAY_RC_TRACK || 'alpha' }}
      status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
